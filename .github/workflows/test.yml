name: Tests

# The harness builds against the stub headers in harness/stubs, so this needs a C++17
# compiler and python3 and nothing else: no DFHack checkout and no Dwarf Fortress.
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

# A new push to a branch makes the run already going on it pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # One of the command tests reads a fraction under a locale whose decimal point is a
      # comma, which is where a conversion that goes through the C library gets it wrong. The
      # runner image has no such locale, and the test says so and checks the C locale only
      # rather than failing, so without this step that check would quietly not happen here.
      - name: Install a comma-decimal locale
        run: |
          sudo locale-gen de_DE.UTF-8
          sudo update-locale
          locale -a | grep -i '^de_DE'

      # Builds and runs the seven unit test suites, replays the recording the codec test
      # writes, and replays everything in harness/recordings against harness/expected.
      # It exits non-zero when any of that fails.
      #
      # -Werror is set here rather than in the harness scripts so that the build is held
      # warning-clean against the one compiler this file pins, and a warning that some other
      # compiler invents stays a warning on the machine that sees it instead of stopping the
      # work. Both scripts take it from CXXFLAGS.
      # HARNESS_ALLOW_NO_RECORDINGS is a standing admission, not a setting. harness/recordings/
      # is empty: commit b4c32fc deleted both fixtures, and they cannot be restored as they were
      # because they are format 2 and the reader now accepts format 7 only. Without this the
      # harness fails, which is what it should do -- the replay against expected/ is the only
      # check that a change leaves the drawing alone on a real scene, and nothing else covers
      # it. Delete this line the moment a scene is recorded in the game at the current format.
      - name: Run the harness
        env:
          CXXFLAGS: -Werror
          HARNESS_ALLOW_NO_RECORDINGS: 1
        run: harness/test.sh .
